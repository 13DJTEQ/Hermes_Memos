# Reusable CI — one engine for every stack. Adapted for Hermes_Memos (Python plugin).
# Deploy is a SEPARATE workflow (deploy-staging.yml); CI never deploys.
name: CI Reusable
on:
  workflow_call:
    inputs:
      stack:
        description: "node | python | go | ios | generic"
        required: true
        type: string
      working-directory:
        description: "Subdirectory holding the project (default repo root)"
        required: false
        type: string
        default: "."
      python-version:
        required: false
        type: string
        default: "3.10"
      lint-command:
        required: false
        type: string
        default: ""
      build-command:
        required: false
        type: string
        default: ""
      test-command:
        required: false
        type: string
        default: ""

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Python setup
        if: inputs.stack == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Syntax check (compile all .py)
        if: inputs.stack == 'python'
        run: python -m compileall -q .

      - name: Lint
        if: inputs.lint-command != ''
        run: ${{ inputs.lint-command }}

      - name: Build
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}

      - name: Test
        if: inputs.test-command != ''
        run: ${{ inputs.test-command }}
