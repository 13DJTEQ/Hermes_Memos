# CI caller for Python projects.
name: CI (Python)
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
jobs:
  call-ci:
    uses: ./.github/workflows/ci-reusable.yml
    with:
      stack: python
      python-version: "3.12"
      lint-command: "flake8 --select=E9,F63,F7,F82 ."
      build-command: "python -m build"
      test-command: "pytest skill/tests -q"
